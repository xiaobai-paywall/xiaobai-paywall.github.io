name: 扫描机会

on:
  schedule:
    # GitHub 的定时任务高峰期会延后甚至跳过，所以设三个时间点（北京时间 6:00、7:00、8:00，cron 用 UTC），
    # 当天已经扫描过的话后面的直接跳过，每天最多扫描一次
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  # GitHub 的定时任务在这个仓库一直没触发过，所以由 cron-job.org 每天 6:00、7:00 调接口触发（auto=1），
  # 和定时触发一样：今天已扫描过就跳过
  workflow_dispatch:
    inputs:
      auto:
        description: "自动触发（今天已扫描过就跳过）"
        required: false
        default: "0"

permissions:
  contents: write

# 同一时间只跑一个，后来的排队，不会叠加
concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
      DB: 扫描机会/数据/scout.db
    steps:
      - uses: actions/checkout@v4

      # 手动触发总是运行；定时触发和 auto=1 时，今天（北京时间）已经扫描过就跳过
      - name: 检查今天是否已扫描
        id: check
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          gh release download scan-data --pattern latest.js --dir 扫描机会/数据 --clobber || true
          last=$(grep -oE '"date":"[0-9-]+"' 扫描机会/数据/latest.js 2>/dev/null | head -1 | cut -d'"' -f4)
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.auto }}" = "1" ]; } && [ "$last" = "$today" ]; then
            echo "今天（$today）已经扫描过，跳过"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with:
          python-version: "3.12"

      # 排名数据库不进 Git（每天一份会越积越大），存在 Release「scan-data」的附件里，每天覆盖
      - name: 下载排名数据库
        if: steps.check.outputs.skip != '1'
        run: gh release download scan-data --pattern scout.db --dir 扫描机会/数据 || echo "还没有历史数据库，从零开始"

      - name: 扫描并发布
        if: steps.check.outputs.skip != '1'
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: python 扫描机会/scout.py

      - name: 上传排名数据库
        if: always() && steps.check.outputs.skip != '1'
        run: |
          if [ -f "$DB" ]; then
            gh release upload scan-data "$DB" --clobber
          fi

      # Google Play 用非官方接口抓，失败了不影响上面 App Store 的结果
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with:
          node-version: "22"

      - name: 扫描 Google Play
        id: gp
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          npm ci --prefix 扫描机会 --no-audit --no-fund
          gh release download scan-data --pattern gp.db --dir 扫描机会/数据 || echo "还没有 Google Play 历史数据库，从零开始"
          python 扫描机会/scout.py --store gp

      - name: 上传 Google Play 数据库
        if: always() && steps.check.outputs.skip != '1'
        run: |
          if [ -f 扫描机会/数据/gp.db ]; then
            gh release upload scan-data 扫描机会/数据/gp.db --clobber
          fi

  # 扫描数据在 Release 里，部署网站时取用
  deploy:
    needs: scan
    if: always() && needs.scan.outputs.skip != '1'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
