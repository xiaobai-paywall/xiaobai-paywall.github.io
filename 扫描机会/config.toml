# 扫描机会（App Store 高价订阅新品雷达）配置

country = "us"

# 要扫描的苹果分类：编号 = 名称（与七麦的应用分类一致，不含游戏）
# 「儿童」不是独立分类，儿童应用的主分类是教育、娱乐等，已包含在内
[genres]
6000 = "商务"
6001 = "天气"
6002 = "工具"
6003 = "旅游"
6004 = "体育"
6005 = "社交"
6006 = "参考"
6007 = "效率"
6008 = "摄影与录像"
6009 = "新闻"
6010 = "导航"
6011 = "音乐"
6012 = "生活"
6013 = "健康健美"
6015 = "财务"
6016 = "娱乐"
6017 = "教育"
6018 = "图书"
6020 = "医疗"
6021 = "报刊杂志"
6023 = "美食佳饮"
6024 = "购物"
6026 = "软件开发工具"
6027 = "图形和设计"

[filter]
# 只看上线不超过这么多天的产品（730 天，2 年）
max_age_days = 730
# 有下载量：必须进本分类免费榜前 100，且估算日下载不低于这个数
# 估算方法：分类名次 → 换算成「全部应用」总榜等效名次 → 按 [calibration] 的样本换算成日下载
min_daily_downloads = 1000
# 有付费：必须进本分类畅销榜前 100（不再按变现倍数筛，它要把名次外推到总榜前 100 之外，误差太大）
# 高价：最贵内购 >= 这个价。苹果没有公开内购列表的排序依据，所以不用“第 1 个内购”的价格
min_max_price = 19.99
# 排除的头部开发者（与 App Store 上的开发者名完全一致）
exclude_developers = [
  "Google LLC",
  "Microsoft Corporation",
  "Apple",
  "Meta Platforms, Inc.",
  "Bending Spoons Apps IVS",
  "Adobe Inc.",
  "Bytedance Pte. Ltd",
  "Lemon Inc",
  "X Corp.",
  "X.AI LLC",
  "OpenAI",
  "Anthropic PBC",
]

# 多国家（只用于 iOS）：除 country 外，再抓这些国家各分类的免费榜和畅销榜，看候选是不是在多个国家都有下载。
# 只抓榜单，不抓应用页面；只存上线不超过 max_age_days 的新品，保留 keep_days 天。
# 每个国家的值是 iOS 下载体量相对美国的粗略系数，日下载 = 按美国曲线换算出的日下载 × 系数，用来横向比较，不是精确数字
[global]
min_country_downloads = 300   # 一个国家估算日下载达到这个数才算「有量」
# 海外机会：不在美国名单里，但至少这么多个国家有量、这么多个国家进了分类畅销榜前 100
overseas_min_countries = 3
overseas_min_grossing = 2
workers = 6
keep_days = 14

[global.countries]
gb = 0.22   # 英国
de = 0.20   # 德国
fr = 0.20   # 法国
it = 0.12   # 意大利
es = 0.12   # 西班牙
nl = 0.06   # 荷兰
pl = 0.05   # 波兰
ca = 0.12   # 加拿大
au = 0.08   # 澳大利亚
jp = 0.11   # 日本。2026-11-11 的 4 个样本（美国估算本身在 1.5 倍内）真实/估算都在 0.25–0.33，留一法从 3.5 倍降到 1.2 倍。原先 0.35 估多了约 3 倍
kr = 0.10   # 韩国
tw = 0.06   # 台湾
id = 0.07   # 印尼
ph = 0.06   # 菲律宾
vn = 0.08   # 越南
th = 0.07   # 泰国
my = 0.04   # 马来西亚
in = 0.20   # 印度
tr = 0.10   # 土耳其
sa = 0.06   # 沙特
br = 0.20   # 巴西
mx = 0.15   # 墨西哥
co = 0.05   # 哥伦比亚

# Google Play（scout.py --store gp）：每个榜 200 名；下载量不用估算，用 Google 公布的累计安装数，
# 和最近 7 天里最早的记录相减得到日均新增（刚开始记录时先用上线以来的日均）
# [gp.filter] 里写的项会覆盖上面 [filter] 的同名项
[gp.filter]
min_daily_downloads = 1000

# Google Play 的应用分类（不含游戏）：分类 ID = 名称
[gp.genres]
ANDROID_WEAR = "穿戴设备"
ART_AND_DESIGN = "艺术设计"
AUTO_AND_VEHICLES = "汽车"
BEAUTY = "美容"
BOOKS_AND_REFERENCE = "图书参考"
BUSINESS = "商务"
COMICS = "漫画"
COMMUNICATION = "通讯"
DATING = "约会"
EDUCATION = "教育"
ENTERTAINMENT = "娱乐"
EVENTS = "活动"
FINANCE = "财务"
FOOD_AND_DRINK = "美食"
HEALTH_AND_FITNESS = "健康健身"
HOUSE_AND_HOME = "家居"
LIFESTYLE = "生活"
MAPS_AND_NAVIGATION = "地图导航"
MEDICAL = "医疗"
MUSIC_AND_AUDIO = "音乐音频"
NEWS_AND_MAGAZINES = "新闻杂志"
PARENTING = "育儿"
PERSONALIZATION = "个性化"
PHOTOGRAPHY = "摄影"
PRODUCTIVITY = "效率"
SHOPPING = "购物"
SOCIAL = "社交"
SPORTS = "体育"
TOOLS = "工具"
TRAVEL_AND_LOCAL = "旅行本地"
VIDEO_PLAYERS = "视频播放"
WATCH_FACE = "表盘"
WEATHER = "天气"

[top]
# 每日跟进 Top N：同时满足下面三条的候选按得分取前 N 个，每个分类最多一个；不够时按得分补齐并标「放宽」
# 设为 0 时页面和飞书都不显示 Top；恢复改回 3
n = 0
# 变现效率排在本分类前这个比例（同时上了免费榜和畅销榜的应用里，免费榜名次 ÷ 畅销榜名次越大越靠前）
eff_top = 0.3
# 最贵内购不低于这个价
min_max_price = 49.99
# 第三条固定：畅销榜比近 7 天最早一份快照上升，或者是新进榜

[calibration]
# 真实日下载样本，用来把总榜等效名次换算成日下载。在七麦「昨日下载数」或 AppMagic 看到就填进来，
# 样本越多、覆盖的名次范围越广，估算越准；2 个以上样本时会自动拟合下面的斜率
anchors = [
  { app_id = "6752642525", daily_downloads = 1382, date = "2026-11-05", note = "FoilSnap，七麦" },
]
# 样本少于 2 个时使用：名次翻倍，日下载约降到 2^-0.6 ≈ 66%
download_exponent = 0.6

[fetch]
# 内购列表缓存天数，避免每天重复抓取网页
iap_refresh_days = 3
# 并发抓取网页的线程数
workers = 3

[feishu]
# 本文件会随仓库公开推送，Webhook 和密钥不要填在这里。
# 在同目录新建 config.local.toml（不进 Git），写入：
#   [feishu]
#   webhook = "https://open.feishu.cn/open-apis/bot/v2/hook/..."
#   secret = ""        # 机器人开启“签名校验”时填写
# 也可以用环境变量 FEISHU_WEBHOOK / FEISHU_SECRET
top_n = 10
# 飞书消息底部的“查看全部”链接
report_url = "https://xiaobai-paywall.github.io/#/scan"

[publish]
# 每天扫描完把 数据/latest.js（latest_gp.js）覆盖上传到 GitHub Release「scan-data」并部署网站
# 数据文件不进 Git，仓库不会越积越大。注意：仓库和网页都是公开的
auto_push = true

# 功能聚合：按功能把候选归成一类，方便看哪些功能有多家在同时赚钱、可以复制。
# 用应用名称、中文简介和功能标签做关键词匹配（不分大小写），从上往下先匹配上的为准，
# 所以更具体的功能要放在更宽泛的前面（例如「AI 角色互动小说」要在「言情网文」前面）。
# 匹配不上的显示为「未归类」；个别分错的，在下面 [theme_assign] 里按 App ID 直接指定。
[theme_assign]
"6751195451" = "车机投屏 / CarPlay 美化"   # AutoScreen: Car Screen Mirror，简介里提到 GPS 会被归到导航
"com.moniqtap.carplay.autocar.connect.android" = "车机投屏 / CarPlay 美化"   # Car Play Connect（GP），同上
# 填空字符串表示不归类
"com.live.flight.tracker" = ""                   # Flightsky 航班追踪，会被归到驾驶记录
"com.gg.housedesign.draw.houseplan.free" = ""    # 房屋设计，会被归到习惯 / 计划
"com.woodworkingplan.woodidentify" = ""          # 木工图纸，会被归到户外

# 清理类的简介常提到照片、视频，要放在照片、视频类前面
[[themes]]
name = "手机清理 / 存储清理"
keywords = ["cleaner", "cleanup", "clean up", "storage clean", "phone storage", "junk", "清理", "重复照片", "释放空间"]

# 简介里常提到 scanner（警用电台），要放在「打印扫描」前面
