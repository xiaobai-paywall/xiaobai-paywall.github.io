[feishu]
# 本文件会随仓库公开推送，Webhook 和密钥不要填在这里。
# 在同目录新建 config.local.toml（不进 Git），写入：
#   [feishu]
#   webhook = "https://open.feishu.cn/open-apis/bot/v2/hook/..."
#   secret = ""        # 机器人开启“签名校验”时填写
# 也可以用环境变量 FEISHU_WEBHOOK / FEISHU_SECRET
top_n = 10
# 飞书消息底部的“查看全部”链接
report_url = "https://xiaobai-paywall.github.io/#/scan"

[publish]
# 每天扫描完自动把 数据/latest.js 提交并推送到 GitHub，网页版随之更新
# 注意：仓库和网页都是公开的
auto_push = true
